  Summary:  Tier 2 entry point. The framework serves this file verbatim at
            the app's mount point and injects nothing. No HTMX, no shell,
            no opinions. The swatches are classes, not style= attributes:
            the default CSP (spec/protocol.md §9.3) has no style-src, so
            default-src 'self' governs styles and an inline one is dropped.
-->
<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Sketch</title>
<link rel="stylesheet" href="style.css">

<canvas id="pad"></canvas>

<nav id="tools">
  <button data-color="#00274C" class="swatch swatch-navy" aria-label="Navy"></button>
  <button data-color="#FFCB05" class="swatch swatch-maize" aria-label="Maize"></button>
  <button data-color="#333333" class="swatch swatch-charcoal" aria-label="Charcoal"></button>
  <button id="clear" aria-label="Clear the canvas">Clear</button>
  <span id="status" role="status"></span>
</nav>

<script type="module" src="app.js"></script>
