# Project:  Privatium™  |  File: crates/xtask/Cargo.toml
# Authors:  Gabriel Mongefranco (@gabrielmongefranco)
# Created:  2026-08-31  |  Modified: 2026-08-31
# Summary:  Repository checks, run as `cargo xtask <command>`. Never shipped, never a
#           dependency of anything that is.

[package]
name        = "xtask"
description = "Privatium repository checks. Not published, not shipped."
publish     = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[dependencies]
anyhow = { workspace = true }
serde  = { workspace = true }
sha2   = { workspace = true }
toml   = { workspace = true }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
