# Project:  Privatium™  |  File: crates/privatium-core/Cargo.toml
# Authors:  Gabriel Mongefranco (@gabrielmongefranco)
# Created:  2026-08-31  |  Modified: 2026-09-03
# Summary:  The library. One core crate per ADR 0002 — the server, the shells, and
#           (later) uniffi all consume this and nothing else.

[package]
name        = "privatium-core"
description = "Privatium core: event log, store, app host, and the Request/Response interface."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[dependencies]
# The two foreign engines. They are here rather than under dev-dependencies because risk
# R1 is about the shipped artefact: if either were test-only, the binary size CI reports
# would not be the size of the binary we ship.
#
# SQLite, via rusqlite (docs/decisions/0006). `bundled` compiles the amalgamation vendored
# inside libsqlite3-sys — one C file, about a minute — with JSON1 and FTS5 compiled in and
# nothing downloaded. Extension loading is disabled at the API (rusqlite's `load_extension`
# feature is off) and refused by name in the sandbox authorizer besides. `functions`,
# `window` and `collation` are the framework's exact-decimal SQL surface
# (spec/data-dictionary.md §2.1, `store::decimal`); `hooks` is the authorizer that makes
# an app's connection read-only (spec/app-contract.md §7, `store::sandbox`).
#
# `column_metadata` (M7) compiles the amalgamation with SQLITE_ENABLE_COLUMN_METADATA, so
# a result column reports the table and column it originates in — through views too —
# which is how pv.query finds a column's declared type (spec/lua-api.md §3.2): the cache
# declares storage types, and DECIMAL or BIGINT lives only in the schema.
rusqlite  = { workspace = true, features = ["bundled", "functions", "window", "collation", "hooks", "column_metadata"] }
mlua      = { workspace = true, features = ["lua54", "vendored", "send"] }
# M12 — the linter reads app.lua, lib/*.lua and every template's Lua as an AST rather than
# as text (docs/plans/phase-1.md M12: rules over a full_moon AST, never regex). `lua54` is
# the dialect the host runs; the default `serde` feature is off, since nothing here
# serializes a tree. MPL-2.0, allowed in deny.toml since M0 for exactly this crate.
full_moon = { workspace = true, features = ["lua54"] }
thiserror = { workspace = true }

# M1 — node identity (spec/protocol.md §2.1). Promoted from [dev-dependencies], where M0
# put them so that rand_core/digest skew across the three would fail before M1 depended
# on it. `zeroize` is on by default and clears SigningKey's own bytes on drop; it is named
# anyway, and taken as a direct dependency, because identity.rs also has to wipe the
# buffer it reads node.key into — that one belongs to us, not to the crate.
ed25519-dalek = { workspace = true, features = ["rand_core", "zeroize"] }
rand          = { workspace = true }
sha2          = { workspace = true }
base64        = { workspace = true }
zeroize       = { workspace = true }

# M2 — sys_audit rows are keyed by a ULID (spec/data-dictionary.md §3.10). The only
# minting site in Phase 1: §4.1 makes a ULID the default row key, but sys_device and
# sys_node are keyed by Node ID, and the Lua and HTTP callers that mint their own arrive
# in M7 and M9.
ulid = { workspace = true }

# M1 — the §3 data root, the `ts` field, config.toml, and the two bootstrap events.
# `raw_value` is for the materializer (`store::events`): it reads each event's `d` as raw
# JSON text so a number keeps its own digits and never passes through a double
# (spec/data-dictionary.md §2.1). Reading only; nothing re-serializes a line (§4.2).
directories = { workspace = true }
jiff        = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true, features = ["raw_value"] }
toml        = { workspace = true }

# M6 — the wire (ADR 0003) and the shell. `axum` with default features off is taken for the
# `http` types and the boxed streaming `Body` that `Request` and `Response` carry — no
# router, no `serve`; nothing in this crate listens on a socket. `tower` is the
# `Layer`/`Service` shape `auth_layer` has (spec/app-contract.md §6). `tower-http`'s
# `ServeDir` streams a Tier 2 app's `web/` in 64 KiB frames and refuses `..`; `tokio` is
# what it reads files through, and (`rt`, M7) what hands a Lua handler to a blocking
# thread — the runtime itself belongs to the adapter. `hmac` and
# `hkdf` derive the CSRF key of docs/plans/phase-1.md §2.2 from the node key, so no
# secret is written anywhere. `include_dir` embeds the icons, the shell's assets and
# `skills/` (docs/icons.md, spec/cli.md §6).
axum        = { workspace = true }
tower       = { workspace = true, features = ["util"] }
tower-http  = { workspace = true, features = ["fs"] }
# M9 — `sync` is the per-app broadcast every append goes out on and the channel an SSE
# body is read from; `time` is the stream's 30-second ping (spec/data-api.md §3);
# `macros` is `select!` in the stream's pump, already in the release graph through the
# binary crate. `futures-core` is the `Stream` trait `Body::from_stream` takes.
tokio        = { workspace = true, features = ["fs", "rt", "sync", "time", "macros"] }
futures-core = { workspace = true }
hmac        = { workspace = true }
hkdf        = { workspace = true }
include_dir = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# M6 — the route tests drive `Handler::handle` on a runtime; there is no listener in them.
tokio    = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints.rust]
# AGENTS.md, Style: no `unsafe` without a comment naming the invariant it upholds. Deny
# rather than forbid, so such a site can opt out explicitly and be reviewed.
unsafe_code = "deny"

[lints.clippy]
# AGENTS.md, Style: never unwrap() outside tests or main() startup. Integration tests
# under tests/ opt out at the top of the file.
unwrap_used = "deny"
expect_used = "deny"
