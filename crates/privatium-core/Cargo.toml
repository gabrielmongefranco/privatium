# Project:  Privatium™  |  File: crates/privatium-core/Cargo.toml
# Authors:  Gabriel Mongefranco (@gabrielmongefranco)
# Created:  2026-08-31  |  Modified: 2026-09-01
# Summary:  The library. One core crate per ADR 0002 — the server, the shells, and
#           (later) uniffi all consume this and nothing else.

[package]
name        = "privatium-core"
description = "Privatium core: event log, store, app host, and the Request/Response interface."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[dependencies]
# M0 links these two and nothing else. They are here rather than under dev-dependencies
# because risk R1 is about the shipped artefact: if DuckDB and Lua were test-only, the
# binary size CI reports would not be the size of the binary we ship.
#
# `bundled` compiles DuckDB from the amalgamation shipped inside libduckdb-sys and
# unpacked with flate2. It does not fetch anything: the download path is in that crate's
# `mod build_linked`, which is `#[cfg(not(feature = "bundled"))]` and gated again on
# `DUCKDB_DOWNLOAD_LIB`, so with `bundled` on the networking code is not compiled at all.
# Offline and reproducible builds are fine. What is real is that `ureq` and `webpki-roots`
# are unconditional build-dependencies and so compile regardless — build time and
# supply-chain surface, not a network call, and the reason deny.toml carries a scoped
# licence exception. Checked against libduckdb-sys 1.10505.0; re-check on a major bump.
#
# M3 — `json` is not optional and is not a convenience. `libduckdb-sys`'s
# `build_bundled_cc.rs` compiles an extension only when its cargo feature is on, so with
# `bundled` alone the binary has no `read_json()`, no `JSON` type, and no
# `json_extract_string()` — which is the whole of the §4.5 projection. Turning it on is
# also what satisfies `AGENTS.md`'s "extensions statically linked": the feature defines
# `DUCKDB_EXTENSION_JSON_LINKED` and `LoadAllExtensions` loads it at instance
# construction, so nothing is ever autoloaded. That same build sets
# `DUCKDB_EXTENSION_AUTOLOAD_DEFAULT=1`, so autoload-**off** is not free and every
# connection turns it off explicitly; `test_r1_duckdb_json_is_statically_linked` is the
# proof. `parquet` is deliberately absent — it belongs to M4's snapshots.
duckdb    = { workspace = true, features = ["bundled", "json"] }
mlua      = { workspace = true, features = ["lua54", "vendored", "send"] }
thiserror = { workspace = true }

# M1 — node identity (spec/protocol.md §2.1). Promoted from [dev-dependencies], where M0
# put them so that rand_core/digest skew across the three would fail before M1 depended
# on it. `zeroize` is on by default and clears SigningKey's own bytes on drop; it is named
# anyway, and taken as a direct dependency, because identity.rs also has to wipe the
# buffer it reads node.key into — that one belongs to us, not to the crate.
ed25519-dalek = { workspace = true, features = ["rand_core", "zeroize"] }
rand          = { workspace = true }
sha2          = { workspace = true }
base64        = { workspace = true }
zeroize       = { workspace = true }

# M2 — sys_audit rows are keyed by a ULID (spec/data-dictionary.md §3.10). The only
# minting site in Phase 1: §4.1 makes a ULID the default row key, but sys_device and
# sys_node are keyed by Node ID, and the Lua and HTTP callers that mint their own arrive
# in M7 and M9.
ulid = { workspace = true }

# M1 — the §3 data root, the `ts` field, config.toml, and the two bootstrap events.
directories = { workspace = true }
jiff        = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
toml        = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints.rust]
# AGENTS.md, Style: no `unsafe` without a comment naming the invariant it upholds. Deny
# rather than forbid, so such a site can opt out explicitly and be reviewed.
unsafe_code = "deny"

[lints.clippy]
# AGENTS.md, Style: never unwrap() outside tests or main() startup. Integration tests
# under tests/ opt out at the top of the file.
unwrap_used = "deny"
expect_used = "deny"
