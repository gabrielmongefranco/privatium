# Project:  Privatium™  |  File: crates/privatium/Cargo.toml
# Authors:  Gabriel Mongefranco (@gabrielmongefranco)
# Created:  2026-08-31  |  Modified: 2026-09-04
# Summary:  The binary — spec/cli.md, parsed by hand (src/cli.rs) — and beside it the axum
#           adapter as a library target so its tests can reach it (ADR 0003: socket and peer
#           address in, `core::handle` out — no routes of its own). At M0 it existed so that
#           CI had a release artefact whose size means something; M11 made it the front door.

[package]
name        = "privatium"
description = "Privatium node — a personal data framework that syncs without a server."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
name = "privatium"
path = "src/lib.rs"

[[bin]]
name = "privatium"
path = "src/main.rs"

[dependencies]
privatium-core = { workspace = true }
anyhow         = { workspace = true }
# The daily maintenance pass (src/run.rs) names the instant it runs at, which is what a
# snapshot is named by (spec/protocol.md §5.1). Already in the graph beneath the core.
jiff           = { workspace = true }

# M6 — the axum adapter. `http1` and `tokio` are what `axum::serve` needs; the adapter has
# no router, so none of axum's routing or extractor features are on. `tokio`'s `net` is the
# loopback listener of docs/plans/phase-1.md §2.1 and `rt-multi-thread` the runtime `main`
# starts. M11 added `signal` — Ctrl-C flushes local/state.jsonl before the process ends —
# and `time`, for the daily pass that writes the weekly snapshots of spec/protocol.md §5.
axum  = { workspace = true, features = ["http1", "tokio"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "io-util", "signal", "time"] }
tower = { workspace = true, features = ["util"] }

[dev-dependencies]
tempfile   = { workspace = true }
serde_json = { workspace = true }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
